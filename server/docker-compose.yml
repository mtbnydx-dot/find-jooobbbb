services:
  job-tracker:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SYNC_TOKEN: "${SYNC_TOKEN:?请在 .env 中设置 SYNC_TOKEN}"
      EDIT_PASSWORD: "${EDIT_PASSWORD:-}"
      CLOUD_SCHEDULER: "1"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    shm_size: 512mb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
